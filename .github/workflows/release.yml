name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (e.g. v0.1.0)
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.event.pull_request.number || inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'release/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version and create release tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(bash scripts/version.sh)"
          tag="v$version"
          commit="$(git rev-parse HEAD)"
          if [[ "$EVENT_NAME" == pull_request ]]; then
            [[ "$HEAD_BRANCH" == "release/$tag" ]]
            if git rev-parse "refs/tags/$tag" >/dev/null 2>&1; then
              [[ "$(git rev-parse "$tag^{commit}")" == "$commit" ]]
            else
              git tag "$tag" "$commit"
              gh auth setup-git
              git push origin "refs/tags/$tag"
            fi
          elif [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            bash scripts/version.sh --check-tag "$INPUT_TAG"
            [[ "$(git rev-parse "$INPUT_TAG^{commit}")" == "$commit" ]]
          else
            bash scripts/version.sh --check-tag "$GITHUB_REF_NAME"
          fi
          printf 'tag=%s\ncommit=%s\n' "$tag" "$commit" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - run: bash scripts/test-version.sh
      - run: swift test
      - name: Package Apple Silicon app
        run: bash scripts/package-release.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: |
            dist/quick-input-translator-macos-arm64.zip
            dist/quick-input-translator-macos-arm64.zip.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json isDraft > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            jq -e '.isDraft == true' "$RUNNER_TEMP/release.json"
          else
            gh release create "$TAG" --verify-tag --draft --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/quick-input-translator-macos-arm64.zip dist/quick-input-translator-macos-arm64.zip.sha256 --clobber
          gh release edit "$TAG" --draft=false --latest
